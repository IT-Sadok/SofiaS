name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore dependencies
        run: dotnet restore BookingService/BookingService.sln

      - name: Build project
        run: dotnet build BookingService/BookingService.sln --no-restore --configuration Release

      - name: Run Tests
        run: |
          dotnet test BookingService/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=results.trx" \
          --collect "Code Coverage"

      - name: Generate Code Coverage Report
        run: |
          reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:TestResults/CoverageReport" \
          "-reporttypes:Html"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: BookingService/BookingService.Testing/TestResults/results.trx

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: TestResults/CoverageReport/
