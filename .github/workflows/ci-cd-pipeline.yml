name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/ci-cd

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/bookingserviceapi

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore BookingService/BookingService.sln

      - name: Build project
        run: dotnet build BookingService/BookingService.sln --no-restore --configuration Release

      - name: Run Tests
        run: |
          dotnet test BookingService/ \
          --no-build \
          --configuration Release \
          --logger "trx;LogFileName=results.trx" \
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: TestResults/results.trx

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short commit hash
        id: vars
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/bookingserviceapi:${{ env.COMMIT_HASH }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/bookingserviceapi:latest \
                       -f BookingService/BookindService.API/Dockerfile BookingService/

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/bookingserviceapi:${{ env.COMMIT_HASH }}
          docker push ${{ secrets.DOCKER_USERNAME }}/bookingserviceapi:latest
