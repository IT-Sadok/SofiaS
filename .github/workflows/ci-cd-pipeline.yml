name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore BookingService/BookingService.sln

      - name: Build project
        run: dotnet build BookingService/BookingService.sln --no restore --configuration Release
