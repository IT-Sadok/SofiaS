name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0"

      - name: Restore dependencies
        run: dotnet restore BookingService/BookingService.sln

      - name: Build project
        run: dotnet build BookingService/BookingService.sln --no-restore --configuration Release

      - name: Create TestResults Directory
        run: mkdir -p BookingService.Testing/TestResults

      - name: Run Tests
        run: |
          dotnet test BookingService/ \
          --no-build \
          --configuration Release \
          --logger ./TestResults/test-results.trx" \
          --results-directory BookingService/BookingService.Testing/TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.xml
